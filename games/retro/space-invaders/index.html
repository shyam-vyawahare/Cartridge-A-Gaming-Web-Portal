<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders - Cartridge</title>
  <meta name="description" content="Defend Earth. Shoot the invaders before they reach you.">

  <!-- Fonts: Press Start 2P (display), Space Grotesk (body), JetBrains Mono (utility) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Site tokens/base so the game visually matches the rest of Cartridge -->
  <link rel="stylesheet" href="../../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/components.css">

  <!-- Game-specific styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game">

    <!-- ================= GAME HEADER ================= -->
    <header class="game__header">
      <a href="../../../dashboard.html" class="game__back">&larr; Back to Dashboard</a>
      <h1 class="game__title">Space Invaders</h1>
      <div class="game__stats" aria-live="polite">
        <span class="game__stat" id="score-count">Score: 0</span>
        <span class="game__stat" id="lives-count">Lives: 3</span>
      </div>
    </header>

    <!-- ================= GAME BOARD ================= -->
    <section class="game__board" id="game-board">
      <canvas id="game-canvas" width="400" height="450" role="img" aria-label="Space Invaders game board"></canvas>

      <!-- On-screen controls for mobile/touch - keyboard arrows + space work too -->
      <div class="controls" id="controls" aria-label="Ship controls">
        <button type="button" class="controls__btn controls__btn--left" data-action="left" aria-label="Move left">&larr;</button>
        <button type="button" class="controls__btn controls__btn--fire" data-action="fire" aria-label="Fire">FIRE</button>
        <button type="button" class="controls__btn controls__btn--right" data-action="right" aria-label="Move right">&rarr;</button>
      </div>
    </section>

    <!-- ================= GAME OVER / WIN STATE ================= -->
    <div class="game__win" id="game-win" hidden>
      <p class="game__win-message" id="end-message">Game Over</p>
      <p class="game__win-stat" id="final-score"></p>
      <button type="button" class="btn btn--primary" id="restart-btn">Play Again</button>
    </div>

  </main>

  <!-- Scripts -->
  <script src="game.js" defer></script>

</body>
</html>
