<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartridge — Reload your Gaming Nostalgia</title>
  <meta name="description" content="Cartridge is a browser-based gaming platform. Play puzzle and brain-teaser games instantly, no downloads.">

  <!-- Favicon (placeholder — swap once brand icon exists) -->
  <!-- <link rel="icon" href="assets/images/ui/favicon.ico"> -->

  <!-- Fonts: Press Start 2P (display), Space Grotesk (body), JetBrains Mono (utility) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Stylesheets: load order matters — tokens define variables everything below depends on -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/landing.css">

  <!-- TODO: add Open Graph / social share meta tags once we have a share image -->
</head>
<body>

  <!-- ================= NAV ================= -->
  <!-- nav.js injects the shared header/tab-bar here so it only needs to be edited in one place -->
  <div id="site-nav"></div>

  <!-- ================= DEVICE CHECK MODAL ================= -->
  <!-- device-detect.js controls visibility + localStorage; markup lives here so it's styleable via components.css -->
  <div id="device-check-modal" class="modal" hidden>
    <div class="modal__content">
      <!-- TODO: replace placeholder copy once final wording is decided -->
      <h2 class="modal__title">How are you playing?</h2>
      <p class="modal__subtitle">We'll load games built for your device.</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--primary" data-device="mobile">Mobile</button>
        <button type="button" class="btn btn--primary" data-device="desktop">Desktop</button>
      </div>
    </div>
  </div>

  <!-- ================= HERO ================= -->
  <main>
    <section class="hero" id="hero">
      <!-- Marquee lightbox concept: eyebrow tag, display headline, subtitle, CTA -->
      <p class="hero__eyebrow">Now Loading</p>
      <h1 class="hero__title">CARTRIDGE</h1>
      <p class="hero__subtitle">Reload your Gaming Nostalgia</p>
      <p class="hero__description">
        <!-- TODO: finalize hero copy — placeholder for now -->
        Puzzle games, brain teasers, and retro classics — playable instantly, right in your browser.
      </p>
      <a href="dashboard.html" class="btn btn--primary btn--large">Play Now</a>
    </section>

    <!-- ================= FEATURE PREVIEW STRIP ================= -->
    <!-- Optional teaser row for what's on the dashboard — placeholder structure, content TBD -->
    <section class="feature-preview" id="feature-preview">
      <!-- TODO: populate with 3-4 category teasers (Puzzle / Brain Teaser / Retro) once dashboard tiles exist -->
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <!-- TODO: add real footer links (about, contact, socials) in a later task -->
    <p>&copy; 2026 Cartridge. All rights reserved.</p>
  </footer>

  <!-- Scripts: load after DOM content -->
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/device-detect.js" defer></script>

</body>
    </html>
